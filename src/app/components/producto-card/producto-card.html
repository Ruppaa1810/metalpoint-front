<div class="bg-white rounded-xl shadow-sm hover:shadow-md transition-shadow overflow-hidden flex flex-col h-full border border-slate-200">
  <a [routerLink]="['/producto', producto().id]" class="relative aspect-square overflow-hidden bg-slate-100">
    @if (producto().imagen_url && !imagenFallida()) {
      <img [src]="producto().imagen_url" [alt]="producto().nombre" loading="lazy"
           class="w-full h-full object-cover hover:scale-105 transition-transform" (error)="imagenFallida.set(true)">
    } @else {
      <div class="w-full h-full flex items-center justify-center text-slate-300">
        <i class="pi pi-image text-5xl"></i>
      </div>
    }

    @if (sinStock()) {
      <span class="absolute top-2 left-2 bg-slate-900/80 text-white text-xs font-semibold px-2 py-1 rounded-md">Sin stock</span>
    } @else if (pocoStock()) {
      <span class="absolute top-2 left-2 bg-amber-500 text-white text-xs font-semibold px-2 py-1 rounded-md">Últimas {{ producto().stock }}</span>
    }
  </a>

  <div class="p-4 flex flex-col gap-2 flex-1">
    <div class="flex items-center justify-between gap-2">
      <span class="text-xs text-slate-500 uppercase tracking-wide truncate">{{ producto().marca?.nombre }}</span>
      <p-tag [value]="etiquetaUnidad()" severity="secondary" [rounded]="true"></p-tag>
    </div>

    <a [routerLink]="['/producto', producto().id]" class="font-semibold text-slate-800 line-clamp-2 hover:text-amber-600">
      {{ producto().nombre }}
    </a>

    <div class="mt-auto flex items-center justify-between pt-2">
      <span class="text-lg font-bold text-slate-900">{{ precioFormateado() }}</span>
      @if (!enCarrito()) {
        <p-button label="Agregar" icon="pi pi-cart-plus" (onClick)="agregar.emit(producto())" [disabled]="sinStock()"></p-button>
      } @else {
        <div class="flex items-center gap-1">
          <p-button icon="pi pi-minus" severity="secondary" [text]="true" [rounded]="true" size="small" (onClick)="quitar.emit(producto())" ariaLabel="Quitar uno"></p-button>
          <span class="w-8 text-center font-semibold text-slate-800">{{ cantidadEnCarrito() }}</span>
          <p-button icon="pi pi-plus" severity="secondary" [text]="true" [rounded]="true" size="small" (onClick)="agregar.emit(producto())" [disabled]="cantidadEnCarrito() >= producto().stock" ariaLabel="Agregar uno"></p-button>
        </div>
      }
    </div>
  </div>
</div>
