<div class="flex-1 overflow-y-auto p-4 md:p-8 scroll-smooth">
    <div class="max-w-7xl mx-auto flex flex-col gap-4">

        <div class="flex flex-col md:flex-row md:items-end justify-between gap-3">
            <div>
                <h1 class="text-3xl font-bold text-slate-900 dark:text-surface-0">Crear nuevo producto</h1>
                <p class="text-slate-600 dark:text-surface-300">Agrega un nuevo producto al inventario</p>
            </div>
            <div class="flex gap-4">
                <p-button label="Cancelar" [raised]="true" severity="secondary" [routerLink]="['/admin/lista-productos']" />
                <p-button label="Guardar Producto" [raised]="true" severity="primary" icon="pi pi-save" />
            </div>
        </div>

        <div class="grid lg:grid-cols-3 sm:grid-cols-1 gap-4">
            <section class="col-span-2 bg-white dark:bg-surface-900 p-6 rounded-xl border border-slate-200 dark:border-surface-700 shadow-sm">
                <h3 class="text-lg font-bold mb-4">
                    <span class="pi pi-info-circle text-blue-600 mr-1"></span>
                    Información General
                </h3>

                <div class="grid grid-col-1 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-600 dark:text-surface-300 mb-1">Nombre del producto</label>
                        <input pInputText autocomplete="off" class="w-full"
                            placeholder="e.g. Caño Estructural 40x40" />
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-600 dark:text-surface-300 mb-1">Marca</label>
                        <p-select [options]="marcas" optionLabel="name" placeholder="Selecciona una marca"
                            class="w-full" appendTo="body" />
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-600 dark:text-surface-300 mb-1">Categoria</label>
                        <p-select [options]="categorias" optionLabel="name" placeholder="Selecciona un categoria"
                            class="w-full" appendTo="body" />
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-600 dark:text-surface-300 mb-1">Imagen (URL)</label>
                        <input pInputText autocomplete="off" class="w-full"
                            placeholder="e.g. https://direcciónDeImágen" />
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-600 dark:text-surface-300 mb-1">Descripción</label>
                        <textarea rows="5" cols="30" pTextarea fluid></textarea>
                    </div>
                </div>
            </section>

            <section class="bg-white dark:bg-surface-900 p-6 rounded-xl border border-slate-200 dark:border-surface-700 shadow-sm">
                <h3 class="text-lg font-bold mb-4">
                    <span class="pi pi-money-bill text-green-600 mr-1"></span>
                    Precio e Inventario
                </h3>

                <div class="grid lg:grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-600 dark:text-surface-300 mb-1">Precio de Venta ($)</label>
                        <p-icon-field>
                            <p-inputicon class="pi pi-dollar" />
                            <input pInputText autocomplete="off" class="w-full" placeholder="0.00" />
                        </p-icon-field>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 dark:text-surface-300 mb-1">Unidad de medida</label>
                        <p-select [options]="unidades" optionLabel="name" placeholder="Selecciona una unidad"
                            class="w-full" appendTo="body" />
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 dark:text-surface-300 mb-1">Stock Disponible</label>
                        <input pInputText autocomplete="off" class="w-full" placeholder="0" />
                    </div>
                </div>
            </section>
        </div>
    </div>
</div>
