<div class="flex-1 overflow-y-auto p-4 md:p-8 scroll-smooth">
    <div class="max-w-7xl mx-auto flex flex-col gap-4">

        <app-page-header titulo="Inventario de Productos"
            descripcion="Administra tu catálogo, stock y categorías"
            textoBoton="Añadir nuevo producto" (botonPresionado)="nuevoProducto()" />

        <app-filtro-productos></app-filtro-productos>

        <!-- TABLA -->
        <div class="card">
            <p-table [value]="products()"
            [paginator]="true" [rows]="5" [tableStyle]="{ 'min-width': '60rem' }">
                <ng-template #header>
                    <tr>
                        <th>Producto</th>
                        <th>Categoría</th>
                        <th>Marca</th>
                        <th>Stock</th>
                        <th>Precio</th>
                        <th>Status</th>
                        <th>Acciones</th>
                    </tr>
                </ng-template>
                <ng-template #body let-product>
                    <tr>
                        <td class="flex items-center gap-3 font-semibold pr-0 mr-0">
                            <img [src]="product.imagen_url || 'https://placehold.co/96x64?text=Sin+imagen'"
                                [alt]="product.nombre" class="w-24 rounded" />
                            {{ product.nombre }}
                        </td>
                        <td>{{ product.categoria?.nombre }}</td>
                        <td>{{ product.marca?.nombre }}</td>
                        <td>{{ product.stock }}</td>
                        <td>{{ product.precio }}</td>
                        <td>
                            <p-tag [value]="getStatus(product.stock)" [severity]="getSeverity(getStatus(product.stock))" />
                        </td>
                        <td>
                            <div class="flex flex-row">
                                <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" [raised]="true"
                                    severity="secondary" class="mr-4" (onClick)="editarProducto(product)" />
                                <p-button icon="pi pi-trash" [rounded]="true" severity="danger"
                                    (onClick)="eliminarProducto(product.id)" />
                            </div>
                        </td>
                    </tr>
                </ng-template>
                <ng-template #footer>
                    <tr>
                        <td colspan="7">En total son {{ products() ? products().length : 0 }} productos.</td>
                    </tr>
                </ng-template>
            </p-table>
        </div>


    </div>
</div>
