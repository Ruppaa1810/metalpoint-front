<div class="flex-1 overflow-y-auto p-4 md:p-8 scroll-smooth">
    <div class="max-w-7xl mx-auto flex flex-col gap-4">

        <app-page-header titulo="Categorias"
            descripcion="Administra la organización de tus productos por categorias"
            textoBoton="Añadir Categoria" (botonPresionado)="nuevaCategoria()" />

        <app-filtro-categorias></app-filtro-categorias>

        <!-- TABLA -->
        <div class="card">

            <p-table [value]="categorias()"
            [paginator]="true" [rows]="5" [tableStyle]="{ 'min-width': '30rem' }">
                <ng-template #header>
                    <tr>
                        <th>Categoria</th>
                        <th>Categoria Padre</th>
                        <th class="text-center!">Productos</th>
                        <th>Acciones</th>
                    </tr>
                </ng-template>
                <ng-template #body let-categoria>
                    <tr>
                        <td class="font-semibold">
                            {{ categoria.nombre }}
                        </td>
                        <td>{{ categoria.categoria_padre?.nombre ?? '-' }}</td>
                        <td class="text-center!">
                            <p-tag [value]="categoria.productos_count" severity="info" />
                        </td>
                        <td>
                            <div class="flex flex-row">
                                <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" [raised]="true"
                                    severity="secondary" class="mr-4" (onClick)="editarCategoria(categoria)" />
                                <p-button icon="pi pi-trash" [rounded]="true" severity="danger"
                                    (onClick)="eliminarCategoria(categoria.id)" />
                            </div>
                        </td>
                    </tr>
                </ng-template>
                <ng-template #footer>
                    <tr>
                        <td colspan="6">En total son {{ categorias() ? categorias().length : 0 }} categorias.</td>
                    </tr>
                </ng-template>
            </p-table>
        </div>


    </div>
</div>
