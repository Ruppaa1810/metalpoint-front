<div class="min-h-screen bg-linear-to-br from-orange-50 to-amber-100 dark:from-surface-950 dark:to-surface-900 flex items-center justify-center p-4">
    <p-card class="w-full max-w-md shadow-2xl">
        <ng-template pTemplate="header">
            <div class="text-center py-6">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-orange-100 dark:bg-surface-800 mb-4">
                    <i class="pi pi-wrench text-3xl text-orange-600"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-800 dark:text-surface-0 mb-2">Iniciar Sesión</h2>
                <p class="text-gray-600 dark:text-surface-300 text-sm">Ingresa tus credenciales para acceder</p>
            </div>
        </ng-template>

        <form [formGroup]="formLogin" class="space-y-6 px-2 pb-2">
            <!-- Email Field -->
            <div class="space-y-2">
                <label for="email" class="block text-sm font-medium text-gray-700 dark:text-surface-300">
                    Correo Electrónico
                </label>
                <input type="email" formControlName="email" pInputText placeholder="ejemplo@correo.com" fluid />
            </div>

            <!-- Password Field -->
            <div class="space-y-2">
                <label for="password" class="block text-sm font-medium text-gray-700 dark:text-surface-300">
                    Contraseña
                </label>
                <p-password formControlName="password" name="password" placeholder="••••••••"
                    [toggleMask]="true" [feedback]="false" fluid />
            </div>

            <!-- Login Button -->
            <button pButton pRipple type="submit" label="Ingresar" class="w-full py-3 text-base font-semibold"
                (click)="login()" [loading]="isLoading()">
            </button>

            <!-- Register Link -->
            <div class="text-center mt-4">
                <p class="text-sm text-gray-600 dark:text-surface-300">
                    ¿No tienes una cuenta?
                    <a routerLink="/registro" class="text-orange-600 hover:text-orange-800 font-medium ml-1">
                        Regístrate aquí
                    </a>
                </p>
            </div>
        </form>
    </p-card>
</div>
