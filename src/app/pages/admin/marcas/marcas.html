<div class="space-y-4">
  <app-page-header
    titulo="Marcas"
    descripcion="Administrá las marcas de productos disponibles en la tienda."
    textoBoton="Nueva marca"
    (botonPresionado)="abrirNueva()"
  ></app-page-header>

  @if (huboError()) {
    <div class="bg-red-50 border border-red-200 rounded-lg p-4 flex flex-wrap items-center justify-between gap-3">
      <p class="text-sm text-red-700 flex items-center gap-2">
        <i class="pi pi-exclamation-triangle"></i> No se pudieron cargar las marcas.
      </p>
      <p-button label="Reintentar" icon="pi pi-refresh" severity="danger" [text]="true" (onClick)="cargarMarcas()"></p-button>
    </div>
  }

  <p-card>
    <p-table [value]="marcas()" [paginator]="true" [rows]="10" stripedRows [loading]="cargando()">
      <ng-template pTemplate="header">
        <tr>
          <th>Nombre</th>
          <th>Productos</th>
          <th style="width: 120px;">Acciones</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-marca>
        <tr>
          <td class="font-medium text-slate-800 flex items-center gap-2">
            <i class="pi pi-tag text-amber-500"></i> {{ marca.nombre }}
          </td>
          <td>
            <span class="font-semibold">{{ marca.productos_count ?? 0 }}</span>
          </td>
          <td>
            <div class="flex gap-1">
              <p-button icon="pi pi-pencil" severity="secondary" [text]="true" [rounded]="true" (onClick)="abrirEdicion(marca)"></p-button>
              <p-button icon="pi pi-trash" severity="danger" [text]="true" [rounded]="true" (onClick)="confirmarEliminar($event, marca)"></p-button>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </p-card>

  <p-confirmdialog></p-confirmdialog>

  <p-dialog [header]="editandoId ? 'Editar marca' : 'Nueva marca'" [modal]="true" [(visible)]="dialogVisible" [style]="{ width: '420px' }">
    <form [formGroup]="formulario" (ngSubmit)="guardar()" class="space-y-4 pt-2">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Nombre *</label>
        <input pInputText formControlName="nombre" placeholder="Ej: Acindar" class="w-full">
        @if (formulario.get('nombre')?.invalid && formulario.get('nombre')?.touched) {
          <small class="text-red-500">El nombre es obligatorio (máx. 50 caracteres).</small>
        }
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <p-button label="Cancelar" severity="secondary" [text]="true" (onClick)="dialogVisible.set(false)"></p-button>
        <p-button label="Guardar" icon="pi pi-check" type="submit" [loading]="guardando()"></p-button>
      </div>
    </form>
  </p-dialog>
</div>
