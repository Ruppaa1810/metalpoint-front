<div class="max-w-3xl mx-auto px-4 py-8">
  @if (usuario(); as u) {
    <div class="bg-white rounded-xl border border-slate-200 overflow-hidden">
      <div class="bg-slate-900 px-6 py-8 text-white">
        <div class="flex items-center gap-4">
          <div class="w-16 h-16 rounded-full bg-amber-400 text-slate-900 flex items-center justify-center text-2xl font-black">
            {{ u.name.charAt(0) }}{{ u.name.split(' ')[1]?.charAt(0) ?? '' }}
          </div>
          <div>
            <h1 class="text-xl font-bold">{{ u.name }}</h1>
            <p class="text-slate-300 text-sm">{{ u.email }}</p>
          </div>
        </div>
      </div>

      <div class="p-6 space-y-4">
        <div class="flex justify-between items-center">
          <span class="text-sm text-slate-500">Rol asignado</span>
          <p-tag [value]="u.role === 'admin' ? 'Administrador' : 'Usuario'" severity="warn" icon="pi pi-shield"></p-tag>
        </div>
        <p-divider></p-divider>
        @if (u.role === 'admin') {
          <div class="flex justify-between items-center">
            <span class="text-sm text-slate-500">Acceso al panel administrativo</span>
            <i class="pi pi-check-circle text-green-500 text-lg"></i>
          </div>
          <p-divider></p-divider>
        }
        <p class="text-sm text-slate-400">
          Esta pantalla muestra la información de tu cuenta en MetalPoint.
        </p>
      </div>
    </div>
  }
</div>
