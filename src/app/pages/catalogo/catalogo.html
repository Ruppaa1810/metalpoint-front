<div class="max-w-7xl mx-auto px-4 py-8">
  <div class="flex flex-col gap-4 mb-8">
    <h1 class="text-3xl font-bold text-slate-900">Catálogo de productos</h1>

    <div class="bg-white rounded-xl border border-slate-200 p-4 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4 items-end">
      <div class="lg:col-span-2">
        <label class="block text-xs font-semibold text-slate-600 mb-1.5 uppercase tracking-wide">Buscar por nombre</label>
        <p-inputgroup>
          <p-inputgroup-addon><i class="pi pi-search"></i></p-inputgroup-addon>
          <input pInputText placeholder="Ej: disco de corte..." [ngModel]="busqueda()" (ngModelChange)="busqueda.set($event)">
        </p-inputgroup>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1.5 uppercase tracking-wide">Categoría</label>
        <p-select [options]="opcionesCategoria" [(ngModel)]="categoriaSeleccionada" placeholder="Todas" class="w-full" />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1.5 uppercase tracking-wide">Marca</label>
        <p-select [options]="opcionesMarca" [(ngModel)]="marcaSeleccionada" placeholder="Todas" class="w-full" />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1.5 uppercase tracking-wide">Ordenar</label>
        <p-select [options]="opcionesOrden" [(ngModel)]="ordenSeleccionado" placeholder="Sin orden" class="w-full" />
      </div>

      <div class="md:col-span-2 lg:col-span-2">
        <label class="block text-xs font-semibold text-slate-600 mb-1.5 uppercase tracking-wide">
          Precio: $ {{ precioMin().toLocaleString('es-AR') }} – $ {{ precioMax().toLocaleString('es-AR') }}
        </label>
        <p-slider [(ngModel)]="precioMin" [min]="0" [max]="50000" class="w-full mb-3"/>
        <p-slider [(ngModel)]="precioMax" [min]="0" [max]="50000" class="w-full"/>
      </div>

      <div class="flex items-center gap-2">
        <p-button label="Limpiar filtros" icon="pi pi-filter-slash" severity="secondary" [text]="true" (onClick)="limpiarFiltros()"></p-button>
      </div>
    </div>
  </div>

  <p class="text-sm text-slate-500 mb-4">{{ filtradas.length }} producto(s) encontrado(s)</p>

  @if (filtradas.length > 0) {
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
      @for (producto of filtradas; track producto.id) {
        <app-producto-card [producto]="producto"
                           [enCarrito]="enCarrito(producto)"
                           [cantidadEnCarrito]="cantidadEnCarrito(producto)"
                           (agregar)="agregarAlCarrito($event)"
                           (quitar)="quitarDelCarrito($event)" />
      }
    </div>
  } @else {
    <div class="text-center py-20 text-slate-400">
      <i class="pi pi-search text-5xl block mb-4"></i>
      <p class="font-semibold">No se encontraron productos con esos filtros</p>
      <p class="text-sm mt-1">Probá cambiar la búsqueda o limpiar los filtros.</p>
    </div>
  }
</div>
