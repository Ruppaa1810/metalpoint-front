<p-toast position="top-right" />

<div class="min-h-screen flex items-center justify-center bg-slate-100 px-4">
  <div class="bg-white rounded-2xl shadow-sm border border-slate-200 w-full max-w-md p-8">
    <div class="text-center mb-8">
      <a routerLink="/" class="inline-flex items-center gap-2 text-2xl font-bold text-slate-900">
        <i class="pi pi-wrench text-amber-500"></i>
        Metal<span class="text-amber-500">Point</span>
      </a>
      <p class="text-slate-500 text-sm mt-2">Iniciá sesión para continuar</p>
    </div>

    <form [formGroup]="formulario" (ngSubmit)="enviar()" class="space-y-5">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Email</label>
        <input pInputText formControlName="email" type="email" placeholder="tu@email.com" class="w-full" />
        @if (formulario.get('email')?.invalid && formulario.get('email')?.touched) {
          <small class="text-red-500">Ingresá un email válido.</small>
        }
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Contraseña</label>
        <p-password formControlName="password" [feedback]="false" [toggleMask]="true" placeholder="••••••" styleClass="w-full" inputStyleClass="w-full" />
        @if (formulario.get('password')?.invalid && formulario.get('password')?.touched) {
          <small class="text-red-500">La contraseña es obligatoria.</small>
        }
      </div>

      <p-button label="Iniciar Sesión" icon="pi pi-sign-in" type="submit" [loading]="cargando()" class="w-full" />

      <p class="text-center text-sm text-slate-500">
        ¿No tenés cuenta?
        <a routerLink="/registro" class="text-amber-600 hover:underline font-semibold">Registrate</a>
      </p>
    </form>
  </div>
</div>
