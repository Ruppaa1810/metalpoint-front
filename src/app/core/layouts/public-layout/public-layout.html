<div class="min-h-screen flex flex-col bg-slate-100">
  <header class="bg-slate-900 text-white shadow-md">
    <div class="max-w-7xl mx-auto flex items-center justify-between px-4 py-3">
      <a routerLink="/" class="flex items-center gap-2 text-xl font-bold tracking-tight">
        <i class="pi pi-wrench text-amber-400"></i>
        <span>Metal<span class="text-amber-400">Point</span></span>
      </a>

      <div class="flex items-center gap-2 sm:gap-4">
        <nav class="flex items-center gap-1">
          <a routerLink="/catalogo" routerLinkActive="bg-slate-800" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-slate-800 transition-colors">
            Catálogo
          </a>
          @if (esAdmin()) {
            <a routerLink="/admin" class="hidden md:block px-3 py-2 rounded-md text-sm font-medium hover:bg-slate-800 transition-colors">
              <i class="pi pi-wrench mr-1"></i>Panel Admin
            </a>
          }
        </nav>

        <a routerLink="/carrito" class="relative p-2 rounded-md hover:bg-slate-800 transition-colors" title="Carrito">
          <i class="pi pi-shopping-cart text-lg"></i>
          @if (carritoService.cantidadTotal() > 0) {
            <p-badge [value]="carritoService.cantidadTotal()" severity="danger" class="absolute -top-1 -right-1"></p-badge>
          }
        </a>

        @if (nombreUsuario()) {
          <span class="flex items-center gap-2 text-sm">
            <i class="pi pi-user"></i>{{ nombreUsuario() }}
          </span>
        } @else {
          <a routerLink="/login">
            <p-button label="Ingresar" icon="pi pi-user"></p-button>
          </a>
        }
      </div>
    </div>
  </header>

  <main class="flex-1">
    <router-outlet />
  </main>

  <footer class="bg-slate-900 text-slate-400 text-sm">
    <div class="max-w-7xl mx-auto px-4 py-6 flex flex-col md:flex-row items-center justify-between gap-2">
      <a routerLink="/" class="flex items-center gap-2 font-bold text-white">
        <i class="pi pi-wrench text-amber-400"></i>
        <span>Metal<span class="text-amber-400">Point</span></span>
      </a>
      <p>Materiales metalúrgicos para tu obra, taller o industria.</p>
      <p>&copy; 2026 MetalPoint. Todos los derechos reservados.</p>
    </div>
  </footer>
</div>
