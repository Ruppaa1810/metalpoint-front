<aside class="w-64 bg-white border-r border-slate-200 flex-col shrink-0 hidden md:flex">
  <div class="flex items-center gap-2 px-5 h-16 border-b border-slate-200">
    <i class="pi pi-wrench text-amber-500 text-xl"></i>
    <span class="text-lg font-bold text-slate-900">Metal<span class="text-amber-500">Point</span></span>
  </div>

  <nav class="flex-1 py-4 space-y-1">
    <span class="px-5 py-2 text-xs uppercase tracking-wider text-slate-400">Administración</span>

    <a routerLink="/admin" routerLinkActive="bg-amber-50 text-amber-600 border-l-4 border-amber-500"
       [routerLinkActiveOptions]="{exact: true}"
       class="flex items-center gap-3 px-5 py-2.5 text-sm text-slate-600 hover:bg-slate-50 transition-colors border-l-4 border-transparent">
      <i class="pi pi-chart-bar"></i>
      Panel
    </a>
    <a routerLink="/admin/lista-categorias" routerLinkActive="bg-amber-50 text-amber-600 border-l-4 border-amber-500"
       class="flex items-center gap-3 px-5 py-2.5 text-sm text-slate-600 hover:bg-slate-50 transition-colors border-l-4 border-transparent">
      <i class="pi pi-folder"></i>
      Categorías
    </a>
    <a routerLink="/admin/lista-marcas" routerLinkActive="bg-amber-50 text-amber-600 border-l-4 border-amber-500"
       class="flex items-center gap-3 px-5 py-2.5 text-sm text-slate-600 hover:bg-slate-50 transition-colors border-l-4 border-transparent">
      <i class="pi pi-tag"></i>
      Marcas
    </a>
    <a routerLink="/admin/productos" routerLinkActive="bg-amber-50 text-amber-600 border-l-4 border-amber-500"
       class="flex items-center gap-3 px-5 py-2.5 text-sm text-slate-600 hover:bg-slate-50 transition-colors border-l-4 border-transparent">
      <i class="pi pi-box"></i>
      Productos
    </a>

    <span class="px-5 py-2 pt-6 text-xs uppercase tracking-wider text-slate-400">Tienda</span>

    <a routerLink="/" class="flex items-center gap-3 px-5 py-2.5 text-sm text-slate-600 hover:bg-slate-50 transition-colors">
      <i class="pi pi-store"></i>
      Ver tienda pública
    </a>
  </nav>

  <div class="px-5 py-4 border-t border-slate-200">
    <button class="flex items-center gap-3 px-5 py-2.5 text-sm text-red-500 hover:bg-red-50 transition-colors w-full rounded-lg">
      <i class="pi pi-sign-out"></i>
      Cerrar Sesión
    </button>
  </div>
</aside>
