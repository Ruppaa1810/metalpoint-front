<div class="min-h-screen flex flex-col bg-slate-100">
  <p-toast position="top-right" />
  <header class="bg-slate-900 text-white shadow-md">
    <div class="max-w-7xl mx-auto flex items-center justify-between px-4 py-3">
      <a routerLink="/" class="flex items-center gap-2 text-xl font-bold tracking-tight">
        <i class="pi pi-wrench text-amber-400"></i>
        <span>Metal<span class="text-amber-400">Point</span></span>
      </a>

      <div class="flex items-center gap-2 sm:gap-4">
        <nav class="flex items-center gap-1">
          <a routerLink="/" routerLinkActive="bg-slate-800" [routerLinkActiveOptions]="{exact: true}" class="hidden sm:block px-3 py-2 rounded-md text-sm font-medium hover:bg-slate-800 transition-colors">Inicio</a>
          <a routerLink="/catalogo" routerLinkActive="bg-slate-800" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-slate-800 transition-colors">
            <span class="sm:hidden" aria-hidden="true"><i class="pi pi-th-large"></i></span><span class="sr-only sm:not-sr-only">Catálogo</span>
          </a>
          @if (esAdmin()) {
            <a routerLink="/admin" class="hidden md:block px-3 py-2 rounded-md text-sm font-medium hover:bg-slate-800 transition-colors">
              <i class="pi pi-wrench mr-1"></i>Panel Admin
            </a>
          }
        </nav>

        <a routerLink="/carrito" class="relative p-2 rounded-md hover:bg-slate-800 transition-colors" title="Carrito">
          <i class="pi pi-shopping-cart text-lg"></i>
          @if (totalCarrito() > 0) {
            <p-badge [value]="totalCarrito()" severity="danger" class="absolute -top-1 -right-1"></p-badge>
          }
        </a>

        @if (estaLogueado()) {
          <div class="flex items-center gap-2">
            <p-button class="sm:hidden" icon="pi pi-user" severity="secondary" [text]="true" [ariaLabel]="nombreUsuario()" (onClick)="menu.toggle($event)"></p-button>
            <p-button class="hidden sm:inline-flex" [label]="nombreUsuario()" icon="pi pi-user" severity="secondary" [text]="true" (onClick)="menu.toggle($event)"></p-button>
          </div>
        } @else {
          <a routerLink="/login">
            <p-button label="Ingresar" icon="pi pi-user"></p-button>
          </a>
        }

        <p-menu #menu [model]="menuItems()" [popup]="true"></p-menu>
      </div>
    </div>
  </header>

  <main class="flex-1">
    <router-outlet />
  </main>

  <footer class="bg-slate-900 text-slate-400 text-sm">
    <div class="max-w-7xl mx-auto px-4 py-6 flex flex-col md:flex-row items-center justify-between gap-2">
      <p>&copy; 2026 MetalPoint — Hierros y Metalúrgica.</p>
      <p>Trabajo práctico: Panel Administrativo + Tienda Online</p>
    </div>
  </footer>
</div>
